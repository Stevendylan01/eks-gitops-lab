apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-node-info
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: go-node-info
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-node-info
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: go-node-info
      containers:
        - name: go-node-info
          image: 352243450529.dkr.ecr.us-east-1.amazonaws.com/go-node-info@sha256:560ac1fd08f45ee3d628f9c4b59667791efbd52905d32950f06b79f8b99a77fa
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
          resources:
            requests:
              cpu: 25m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
